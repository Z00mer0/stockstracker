name: keep-render-awake

# Render (darmowy plan) usypia backend po ~15 min bezczynności; wybudzenie to
# 30-90s "cold-startu", przez co pierwsze wejście do aplikacji bywa bardzo wolne.
# Ten workflow trzyma backend obudzony pingując /api/health.
#
# Dlaczego pętla, a nie pojedynczy ping: harmonogram GitHub Actions jest
# best-effort i pod obciążeniem opóźnia crony `*/10` nawet do 20-40 min, co
# zostawia >15-min lukę i pozwala Renderowi zasnąć. Każdy bieg pinguje przez
# ~14 min (co 2 min), więc nakładające się biegi dają ciągłe pokrycie mimo
# opóźnień schedulera. Repo jest publiczne → minuty Actions są darmowe.
# Działa jako druga, niezależna kłódka obok push-check.yml.

on:
  schedule:
    - cron: '*/10 * * * *'   # co 10 min (efektywnie rzadziej — stąd pętla w biegu)
  workflow_dispatch: {}       # ręczne odpalenie do testu

permissions: {}               # tylko wychodzący curl — zero uprawnień do repo

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      # Bieg pingujący ~28 min zamiast ~14. Zmierzone odstępy między realnymi
      # uruchomieniami wynosiły od 14 min do 3 h 24 min przy nominalnych 10,
      # a Render zasypia po 15 — dłuższy bieg pokrywa większą część tego
      # rozrzutu. Wielogodzinnej luki nie pokryje nic po tej stronie.
      - name: Ping /api/health przez ~28 min (bridżuje opóźnienia crona)
        run: |
          url="https://stockstracker.onrender.com/api/health"
          n=15
          ok=0
          for i in $(seq 1 $n); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 "$url" || true)
            echo "$(date -u +%H:%M:%S) ping $i/$n -> HTTP ${code:-000}"
            if [ "$code" = "200" ]; then ok=$((ok + 1)); fi
            # Nie "[ ... ] && sleep": przy ostatnim obiegu test jest falszywy,
            # cala instrukcja zwraca 1 i — jako ostatnia w skrypcie — wywala
            # krok, mimo ze wszystkie pingi poszly poprawnie. Tak wygladal
            # kazdy dotychczasowy bieg tego workflow: 15x HTTP 200 i status
            # "failed" na koniec.
            if [ "$i" -lt "$n" ]; then sleep 120; fi
          done
          echo "udanych pingow: $ok/$n"
          # Pojedyncze bledy sa normalne (Render sie wybudza), ale komplet
          # nieudanych oznacza, ze backend nie odpowiada — wtedy chcemy alert.
          if [ "$ok" -eq 0 ]; then
            echo "::error::zaden ping nie zwrocil 200 — backend nie odpowiada"
            exit 1
          fi
