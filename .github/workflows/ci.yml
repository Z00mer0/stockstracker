name: ci

# Testy jednostkowe + build produkcyjny. Build jest tu celowo: przez większość
# życia projektu jedyną weryfikacją było „u mnie działa", a błąd w imporcie
# wychodził dopiero przy wdrożeniu.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - run: npm ci
      # Blokuje na bledach, ostrzezenia przepuszcza. Ostrzezen jest teraz 103
      # (glownie nieuzywane zmienne i zaleznosci useEffect) — wywalanie sie na
      # nich zablokowaloby kazdy PR i skonczyloby sie wylaczeniem lintera.
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Vercel wdraża funkcje z katalogu /api w korzeniu repo (root vercel.json
  # buduje frontend-react, ale sam projekt ma korzeń w repo). Kopia w
  # frontend-react/api jest historyczna i nigdzie nie trafia. Rozjazd między
  # nimi już raz wyłączył pobieranie notowań na produkcji: refaktor batcha
  # zmienił tylko kopię, a wdrożony handler nie znał ?format=map i zwracał 404
  # na każdą paczkę symboli. Ten krok pilnuje, żeby obie kopie były identyczne.
  api-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Katalogi api/ musza byc identyczne
        run: diff -r api frontend-react/api

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Nie uruchamiamy serwera (wymaga bazy i kluczy API) — sprawdzamy, czy
      # w ogóle się kompiluje. Wyłapuje literówki i błędy składni, które inaczej
      # ujawniłyby się dopiero po wdrożeniu na Render.
      - run: python -m py_compile server.py
      # py_compile nie importuje modułu, więc do tej pory job nie potrzebował
      # zależności. Test poniżej importuje server.py naprawdę.
      - run: pip install -r requirements.txt
      # Budżet zapytań do Finnhuba (60/min) jest niewidoczny z zewnątrz —
      # przekroczenie objawia się dopiero brakiem cen u części pozycji.
      # Test zaślepia Finnhuba i liczy wywołania.
      - run: python test_finnhub_batch.py
